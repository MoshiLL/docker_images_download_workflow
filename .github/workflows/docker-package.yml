name: Docker Image Package Builder

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker镜像名称（格式：repository/image:tag）'
        required: true
        default: 'vllm/vllm-openai:nightly'
      release_tag:
        description: 'Release标签（格式：v1.0.0）'
        required: true
        default: 'v'
      split_size:
        description: '分片大小（单位：M，建议1900M以避免2GiB限制）'
        required: true
        default: '1900'

jobs:
  package-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up disk space
        run: |
          echo "清理磁盘空间..."
          # 清理apt缓存
          sudo apt-get clean
          # 删除无用的包
          sudo apt-get autoremove --purge -y
          # 清理旧的内核
          sudo apt-get remove --purge -y $(dpkg -l | grep 'linux-image-.*-generic' | awk '{print $2}' | grep -v $(uname -r)) || true
          # 清理docker缓存
          sudo docker system prune -a -f --volumes
          # 清理旧的日志文件
          sudo journalctl --vacuum-time=1s

          # 清理/mnt确保有足够空间
          sudo rm -rf /mnt/* 2>/dev/null || true
          sudo mkdir -p /mnt/docker
          sudo mkdir -p /mnt/docker_tmp
          sudo chmod 777 /mnt/docker /mnt/docker_tmp

          # 停止Docker服务
          echo "停止Docker服务..."
          sudo systemctl stop docker || true

          # 备份原始Docker配置
          echo "备份原始Docker配置..."
          sudo mkdir -p /etc/docker/backup
          sudo cp -r /var/lib/docker/* /etc/docker/backup/ 2>/dev/null || true

          # 重新配置Docker使用/mnt
          echo "重新配置Docker使用/mnt分区..."
          sudo rm -rf /var/lib/docker 2>/dev/null || true
          sudo ln -s /mnt/docker /var/lib/docker

          # 创建新的Docker数据目录
          sudo mkdir -p /mnt/docker
          sudo chown -R root:root /mnt/docker
          sudo chmod 700 /mnt/docker

          # 重启Docker服务
          echo "重启Docker服务..."
          sudo systemctl start docker

          # 验证Docker配置
          echo "验证Docker配置..."
          docker info
          echo "Docker根目录: $(docker info | grep 'Docker Root Dir')"

          # 设置环境变量作为双重保险
          echo "DOCKER_TMPDIR=/mnt/docker_tmp" >> $GITHUB_ENV
          echo "TMPDIR=/mnt/docker_tmp" >> $GITHUB_ENV
          echo "TEMP=/mnt/docker_tmp" >> $GITHUB_ENV
          echo "TMP=/mnt/docker_tmp" >> $GITHUB_ENV
          echo "环境变量设置完成:"
          env | grep -E "(DOCKER_TMPDIR|TMPDIR|TEMP|TMP)"
          # 验证目录权限
          ls -la /mnt/docker_tmp
          
          echo "清理后磁盘空间:"
          df -h
          echo "可用inode:"
          df -i

      - name: Check /mnt permissions
        run: |
          echo "检查/mnt目录权限..."
          ls -la /mnt
          echo "当前用户: $(whoami)"
          echo "用户组: $(groups)"
          
          # 尝试创建测试目录
          echo "尝试创建测试目录..."
          sudo mkdir -p /mnt/test_dir_$$
          sudo chmod 777 /mnt/test_dir_$$
          echo "测试目录创建成功，权限设置完成"
          sudo rm -rf /mnt/test_dir_$$

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Pull Docker image
        run: |
          echo "正在下载镜像: ${{ github.event.inputs.image_name }}"
          # 拉取镜像
          docker pull ${{ github.event.inputs.image_name }}
          
          echo "镜像信息:"
          docker images
          
          echo "Docker系统状态:"
          docker system df

      - name: Save and split image on /mnt with sudo
        run: |
          IMAGE_NAME="${{ github.event.inputs.image_name }}"
          SPLIT_SIZE="${{ github.event.inputs.split_size }}M" 
          
          echo "检查/mnt分区空间..."
          df -h /mnt
          
          echo "创建专用工作目录在/mnt（使用sudo）..."
          WORK_DIR="/mnt/docker_image_package_$$"
          sudo mkdir -p "$WORK_DIR"
          sudo chmod 777 "$WORK_DIR"
          sudo chown -R $USER:$USER "$WORK_DIR"
          
          echo "工作目录权限:"
          ls -la "$WORK_DIR"
          
          echo "正在保存 Docker 镜像到 /mnt 分区..."
          # 使用 docker save 保存完整镜像（包含元数据和层信息）
          docker save "$IMAGE_NAME" -o "$WORK_DIR/image.tar"
          
          echo "镜像保存完成，文件大小: $(du -h "$WORK_DIR/image.tar")"
          
          # 验证文件是否生成
          if [ ! -s "$WORK_DIR/image.tar" ]; then
            echo "❌ 保存失败，文件为空。"
            exit 1
          fi
          
          # 检查/mnt空间
          echo "/mnt分区空间使用情况:"
          df -h /mnt
          
          echo "开始分割文件，每片 $SPLIT_SIZE..."
          cd "$WORK_DIR"
          
          # 分割文件
          split -b "$SPLIT_SIZE" -d --additional-suffix=.part "image.tar" "image.tar.part"
          
          echo "分割完成，分片文件列表:"
          ls -la image.tar.part*

          echo "验证每个分片文件大小（确保<2GiB）..."
          for file in image.tar.part*; do
            FILE_SIZE=$(stat -c%s "$file")
            echo "$file: $FILE_SIZE bytes"
            if [ "$FILE_SIZE" -ge 2147483648 ]; then
              echo "警告: $file 大小超过2GiB限制！"
              exit 1
            fi
          done
          
          # 生成校验和
          echo "生成校验和..."
          sha256sum image.tar.part* > checksums.txt
          sha256sum image.tar >> checksums.txt
          
          # 获取分片数量
          PART_COUNT=$(ls image.tar.part* 2>/dev/null | wc -l)
          echo "分片数量: $PART_COUNT"
          
          # 创建说明文件
          echo "Docker Image Package" > README.txt
          echo "=====================" >> README.txt
          echo "" >> README.txt
          echo "原始镜像: $IMAGE_NAME" >> README.txt
          echo "分片大小: $SPLIT_SIZE (确保小于2 GiB = 2048M)" >> README.txt
          echo "分片数量: $PART_COUNT" >> README.txt
          echo "完整文件大小: $(du -h image.tar | cut -f1)" >> README.txt
          echo "" >> README.txt
          echo "校验和文件说明:" >> README.txt
          echo "- 前$PART_COUNT行是各个分片的SHA256校验和" >> README.txt
          echo "- 最后一行是完整image.tar文件的SHA256校验和" >> README.txt
          echo "" >> README.txt
          echo "使用步骤:" >> README.txt
          echo "1. 从GitHub release下载所有文件（image.tar.part*、checksums.txt、README.txt）" >> README.txt
          echo "2. 在Windows上将所有下载的文件打包成ZIP压缩包" >> README.txt
          echo "3. 将ZIP压缩包上传到Linux服务器" >> README.txt
          echo "4. 在Linux服务器上执行以下命令:" >> README.txt
          echo "" >> README.txt
          echo "# 解压ZIP文件" >> README.txt
          echo "unzip package.zip" >> README.txt
          echo "" >> README.txt
          echo "# 合并分片文件" >> README.txt
          echo "cat image.tar.part* > image.tar" >> README.txt
          echo "" >> README.txt
          echo "# 验证文件完整性" >> README.txt
          echo "sha256sum -c checksums.txt --ignore-missing" >> README.txt
          echo "" >> README.txt
          echo "# 如果验证通过，加载Docker镜像" >> README.txt
          echo "docker load -i image.tar" >> README.txt
          echo "" >> README.txt
          echo "# 清理临时文件" >> README.txt
          echo "rm image.tar.part* image.tar checksums.txt README.txt" >> README.txt
          echo "" >> README.txt
          echo "注意:" >> README.txt
          echo "- 确保所有分片文件都已下载完整" >> README.txt
          echo "- 合并顺序由文件名数字序号保证（part00, part01, part02...）" >> README.txt
          echo "- 如果校验失败，请重新下载对应的分片文件" >> README.txt
          echo "- GitHub release文件限制为2 GiB，因此分片大小设置为1900M" >> README.txt
          
          # 移动文件到工作目录（使用sudo确保权限）
          echo "移动文件到工作目录..."
          sudo mv image.tar.part* $GITHUB_WORKSPACE/
          sudo mv checksums.txt $GITHUB_WORKSPACE/
          sudo mv README.txt $GITHUB_WORKSPACE/
          sudo chown $USER:$USER $GITHUB_WORKSPACE/image.tar.part*
          
          sudo chown $USER:$USER $GITHUB_WORKSPACE/checksums.txt
          
          sudo chown $USER:$USER $GITHUB_WORKSPACE/README.txt
          
          echo "工作目录内容:"
          ls -la $GITHUB_WORKSPACE/
          
          # 清理/mnt上的文件
          echo "清理/mnt上的临时文件..."
          sudo rm -f "$WORK_DIR/image.tar"
          
          echo "清理/mnt工作目录..."
          sudo rm -rf "$WORK_DIR"
          # sudo rm -rf /mnt/docker_tmp
          
          echo "清理完成"

      - name: Create release with batch uploads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始创建release并分批上传文件..."
          
          RELEASE_TAG="${{ github.event.inputs.release_tag }}${{ github.run_number }}"
          RELEASE_NAME="Docker Image Package ${{ github.event.inputs.image_name }} ($RELEASE_TAG)"
          REPO_FULL_NAME="$GITHUB_REPOSITORY"
          
          # 创建 release
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_NAME\",\"body\":\"镜像: ${{ github.event.inputs.image_name }}\\n分片: ${{ github.event.inputs.split_size }}M\"}" \
            "https://api.github.com/repos/$REPO_FULL_NAME/releases")
          
          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | cut -d'{' -f1)
          echo "Upload URL: $UPLOAD_URL"
          
          # 准备文件列表
          PART_FILES=($(ls image.tar.part* 2>/dev/null))
          CHECKSUM_FILE="checksums.txt"
          README_FILE="README.txt"
          
          echo "分批上传分片文件（每批2个，避免超时）..."
          BATCH_SIZE=2
          for ((i=0; i<${#PART_FILES[@]}; i+=BATCH_SIZE)); do
            echo "上传批次 $(($i/$BATCH_SIZE + 1))..."
            for file in "${PART_FILES[@]:$i:$BATCH_SIZE}"; do
              FILENAME=$(basename "$file")
              echo "⬆️ 上传 $FILENAME ..."
              
              # ✅ 关键修改：使用 --upload-file 而不是 --data-binary
              curl -f -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --upload-file "$file" \
                "$UPLOAD_URL?name=$FILENAME" > /dev/null
              
              echo "✅ $FILENAME 上传成功"
              sleep 3
            done
            sleep 5
          done
          
          # 上传小文件
          for file in "$CHECKSUM_FILE" "$README_FILE"; do
            echo "⬆️ 上传 $(basename "$file") ..."
            curl -f -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$file" \
              "$UPLOAD_URL?name=$(basename "$file")" > /dev/null
            echo "✅ $(basename "$file") 上传成功"
          done
          
          echo "🎉 所有文件上传成功！"

      - name: Final cleanup and restore Docker
        if: always()
        run: |
          echo "最终清理和恢复Docker配置..."
          
          # 清理工作文件
          rm -f image.tar.part* 2>/dev/null || true
          rm -f checksums.txt 2>/dev/null || true
          rm -f README.txt 2>/dev/null || true
          
          # 恢复原始Docker配置
          echo "恢复原始Docker配置..."
          sudo systemctl stop docker || true
          
          # 移除符号链接
          sudo rm -f /var/lib/docker
          
          # 恢复原始数据（如果存在）
          if [ -d "/etc/docker/backup" ] && [ "$(ls -A /etc/docker/backup 2>/dev/null)" ]; then
            echo "恢复原始Docker数据..."
            sudo mkdir -p /var/lib/docker
            sudo cp -r /etc/docker/backup/* /var/lib/docker/
            sudo chown -R root:root /var/lib/docker
            sudo chmod 700 /var/lib/docker
          fi
          
          # 重启Docker
          sudo systemctl start docker || true
          
          # 清理临时目录
          sudo rm -rf /mnt/docker_image_package_* 2>/dev/null || true
          # sudo rm -rf /mnt/docker_tmp 2>/dev/null || true
          sudo rm -rf /etc/docker/backup 2>/dev/null || true
          
          # 清理docker系统
          sudo docker system prune -a -f --volumes
          
          # 检查空间
          echo "最终磁盘空间:"
          df -h /mnt
          df -h /
          
          echo "清理完成"
